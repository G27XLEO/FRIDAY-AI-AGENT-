name: FRIDAY Android Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show project files
        working-directory: android
        run: find . -maxdepth 6 -type f | sort

      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --info --warning-mode all
