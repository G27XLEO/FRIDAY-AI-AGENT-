name: FRIDAY Android Companion APK

on:
  push:
    branches:
      - feature/friday-android-companion
  pull_request:
    paths:
      - "android/**"
      - "web/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and verify bundled React interface
        run: |
          npm --prefix web install --no-audit --no-fund
          npm --prefix web run test:standalone
          npm --prefix web run type-check
          npm --prefix web run build

      - name: Copy React distribution into Android assets
        run: |
          mkdir -p android/app/src/main/assets/friday
          cp -a web/dist/. android/app/src/main/assets/friday/
          test -s android/app/src/main/assets/friday/index.html

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install platform and build tools from runner SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android unit tests
        run: gradle -p android :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Android debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Check APK created
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: friday-os-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
