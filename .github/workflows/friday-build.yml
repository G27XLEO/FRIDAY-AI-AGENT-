name: FRIDAY LiveKit Worker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  livekit-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build LiveKit worker image
        run: docker build -t friday-ai-agent:ci .

      - name: Validate image
        run: docker image inspect friday-ai-agent:ci

      - name: Run Python tests
        run: |
          docker run --rm friday-ai-agent:ci python -m unittest discover -v
