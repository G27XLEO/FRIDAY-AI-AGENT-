name: FRIDAY Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build FRIDAY Docker image
        run: docker build -t friday-ai-agent .

      - name: Check Docker image
        run: docker image inspect friday-ai-agent
