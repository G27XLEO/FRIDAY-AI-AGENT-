name: FRIDAY LiveKit Worker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  livekit-worker:
    runs-on: ubuntu-latest
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      # Unit tests must stay runnable on forks/PRs where secrets are unavailable.
      FRIDAY_VALIDATE_RUNTIME_ENV: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build LiveKit worker image
        run: docker build --pull -t friday-ai-agent:ci .

      - name: Validate image
        run: docker image inspect friday-ai-agent:ci

      - name: Validate unit test suite
        run: |
          docker run --rm \
            -e FRIDAY_VALIDATE_RUNTIME_ENV \
            friday-ai-agent:ci \
            python -m unittest discover -s tests -p 'test_*.py' -v

  runtime-secrets:
    name: Validate protected runtime secrets
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      secrets.LIVEKIT_URL != '' &&
      secrets.LIVEKIT_API_KEY != '' &&
      secrets.LIVEKIT_API_SECRET != '' &&
      secrets.GROQ_API_KEY != '' &&
      secrets.ELEVENLABS_API_KEY != ''
    runs-on: ubuntu-latest
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      FRIDAY_VALIDATE_RUNTIME_ENV: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build LiveKit worker image for runtime validation
        run: docker build --pull -t friday-ai-agent:runtime-check .

      - name: Validate configured runtime environment
        run: |
          docker run --rm \
            -e LIVEKIT_URL \
            -e LIVEKIT_API_KEY \
            -e LIVEKIT_API_SECRET \
            -e GROQ_API_KEY \
            -e ELEVENLABS_API_KEY \
            -e FRIDAY_VALIDATE_RUNTIME_ENV \
            friday-ai-agent:runtime-check \
            python -m unittest tests.test_env -v
